<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>InversorAR</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060b14;--s1:#0d1520;--s2:#131f30;--s3:#1a2840;
  --b1:#1e2e45;--b2:#273d58;
  --cy:#00d4ff;--gn:#00ff9d;--or:#ff6b35;--gd:#f5c518;
  --tx:#dde6f5;--mu:#5a7296;--dm:#2d4060;
  --red:#ff3d5a;--ok:#1adb7a;--warn:#ffaa00;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:13px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,212,255,0.06) 0%,transparent 60%),
  radial-gradient(ellipse 40% 30% at 90% 90%,rgba(0,255,157,0.04) 0%,transparent 50%);}

/* ── LAYOUT ── */
#root{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;}

/* ── TOPBAR ── */
.topbar{
  height:52px;flex-shrink:0;
  background:rgba(6,11,20,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding:0 16px;gap:12px;
}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cy),var(--gn));display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 12px rgba(0,212,255,0.25);}
.logo-tx{font-family:var(--fh);font-size:16px;background:linear-gradient(90deg,var(--cy),var(--gn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:9px;color:var(--mu);margin-top:-3px;}

/* ticker */
.ticker{display:flex;gap:0;overflow-x:auto;flex:1;scrollbar-width:none;}
.ticker::-webkit-scrollbar{display:none;}
.tick{display:flex;flex-direction:column;align-items:center;padding:0 12px;border-right:1px solid var(--b1);flex-shrink:0;}
.tick-lbl{font-size:9px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;}
.tick-val{font-family:var(--fm);font-size:13px;font-weight:500;margin-top:1px;}
.tick-val.cy{color:var(--cy);}.tick-val.gn{color:var(--gn);}.tick-val.gd{color:var(--gd);}.tick-val.or{color:var(--or);}
.tick-chg{font-size:9px;margin-top:1px;}
.up{color:var(--ok);}.dn{color:var(--red);}.fl{color:var(--mu);}
.tick-val.loading{color:var(--dm);animation:pulse 1.2s infinite;}

.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.last-upd{font-family:var(--fm);font-size:9px;color:var(--mu);white-space:nowrap;}
.btn-refresh-top{width:28px;height:28px;border-radius:7px;border:1px solid var(--b1);background:var(--s2);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;}
.btn-refresh-top:hover{color:var(--cy);border-color:var(--cy);}
.btn-refresh-top.spinning{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── MAIN CONTENT ── */
.content{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:12px;}
.content::-webkit-scrollbar{width:4px;}.content::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px;}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.card-head{padding:10px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;background:var(--s2);}
.card-title{font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.03em;}
.card-body{padding:12px 14px;}

/* DÓLARES — full width */
.card-dolares{grid-column:1/-1;}
.dolar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.dolar-item{background:var(--s2);border:1px solid var(--b1);border-radius:9px;padding:10px 12px;transition:border-color .2s;}
.dolar-item:hover{border-color:var(--cy);}
.dolar-name{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;}
.dolar-buy{font-family:var(--fm);font-size:18px;font-weight:500;color:var(--tx);margin:3px 0 1px;}
.dolar-sell{font-size:10px;color:var(--mu);}
.dolar-chg{font-size:10px;margin-top:3px;}
.arbitraje-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(0,255,157,0.1);color:var(--gn);border:1px solid rgba(0,255,157,0.2);margin-top:6px;}

/* ACCIONES */
.accion-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b1);}
.accion-item:last-child{border-bottom:none;}
.accion-ticker{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--cy);width:52px;}
.accion-name{font-size:11px;color:var(--mu);flex:1;}
.accion-price{font-family:var(--fm);font-size:12px;text-align:right;}
.accion-chg{font-size:11px;text-align:right;margin-top:1px;}
.rec-badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;}
.rec-c{background:rgba(0,255,157,0.12);color:var(--gn);border:1px solid rgba(0,255,157,0.2);}
.rec-v{background:rgba(255,61,90,0.12);color:var(--red);border:1px solid rgba(255,61,90,0.2);}
.rec-m{background:rgba(245,197,24,0.1);color:var(--gd);border:1px solid rgba(245,197,24,0.2);}
.rec-e{background:rgba(90,114,150,0.1);color:var(--mu);border:1px solid var(--b1);}

/* BONOS */
.bono-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b1);}
.bono-item:last-child{border-bottom:none;}
.bono-ticker{font-family:var(--fm);font-size:12px;color:var(--gd);width:50px;}
.bono-data{font-size:11px;color:var(--mu);flex:1;}
.bono-tir{font-family:var(--fm);font-size:12px;color:var(--tx);}

/* TASAS */
.tasa-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b1);}
.tasa-item:last-child{border-bottom:none;}
.tasa-name{font-size:11px;color:var(--tx);flex:1;}
.tasa-tna{font-family:var(--fm);font-size:13px;color:var(--cy);}
.tasa-real{font-size:10px;margin-top:1px;}

/* ── RECOMENDACIONES — full width ── */
.card-recos{grid-column:1/-1;}
.reco-wrap{font-size:13px;line-height:1.75;color:var(--tx);}
.reco-wrap h1{font-family:var(--fh);font-size:17px;color:var(--cy);margin:14px 0 7px;}
.reco-wrap h2{font-family:var(--fh);font-size:14px;color:var(--cy);margin:12px 0 6px;border-bottom:1px solid var(--b1);padding-bottom:4px;}
.reco-wrap h3{font-family:var(--fh);font-size:12px;color:var(--gn);margin:10px 0 4px;}
.reco-wrap p{margin-bottom:7px;}
.reco-wrap ul{padding-left:16px;margin-bottom:9px;}.reco-wrap li{margin-bottom:3px;}
.reco-wrap strong{color:var(--gd);}
.reco-wrap em{color:var(--mu);}
.reco-wrap code{font-family:var(--fm);font-size:11px;background:var(--s3);padding:1px 5px;border-radius:3px;color:var(--gn);}
.reco-wrap table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto;}
.reco-wrap th{background:var(--s3);color:var(--cy);padding:6px 9px;text-align:left;font-family:var(--fh);border:1px solid var(--b1);white-space:nowrap;}
.reco-wrap td{padding:6px 9px;border:1px solid var(--b1);}
.reco-wrap tr:nth-child(even) td{background:rgba(255,255,255,.01);}
.reco-wrap blockquote{border-left:3px solid var(--or);padding:7px 13px;background:rgba(255,107,53,.05);border-radius:0 6px 6px 0;margin:9px 0;}
.reco-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;color:var(--mu);}
.reco-loading .pulse-icon{font-size:28px;animation:pulse 1.2s infinite;}
.reco-loading p{margin-top:10px;font-size:12px;}

/* ── API KEY SETUP ── */
.setup-overlay{position:fixed;inset:0;background:rgba(6,11,20,0.97);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.setup-box{background:var(--s1);border:1px solid var(--b2);border-radius:16px;padding:28px 24px;max-width:420px;width:100%;}
.setup-box h2{font-family:var(--fh);font-size:20px;background:linear-gradient(90deg,var(--cy),var(--gn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.setup-box p{color:var(--mu);font-size:13px;line-height:1.6;margin-bottom:18px;}
.setup-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.setup-step{display:flex;gap:10px;align-items:flex-start;}
.setup-n{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--gn));color:#060b14;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.setup-t{font-size:12px;color:var(--tx);line-height:1.5;}
.setup-t a{color:var(--cy);}
.setup-t strong{color:var(--gn);}
.key-input-row{display:flex;gap:8px;margin-top:4px;}
.key-input{flex:1;background:var(--bg);border:1px solid var(--b2);border-radius:8px;padding:10px 13px;color:var(--tx);font-family:var(--fm);font-size:12px;outline:none;}
.key-input:focus{border-color:var(--cy);}
.key-input::placeholder{color:var(--dm);}
.btn-go{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cy),var(--gn));color:#060b14;font-family:var(--fh);font-size:13px;font-weight:700;transition:all .2s;white-space:nowrap;}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,212,255,.3);}

/* ── CHAT FLOTANTE ── */
.chat-fab{
  position:fixed;bottom:20px;right:20px;z-index:300;
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cy),var(--gn));
  color:#060b14;font-size:22px;
  box-shadow:0 4px 20px rgba(0,212,255,0.4);
  transition:all .25s;display:flex;align-items:center;justify-content:center;
}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(0,212,255,0.5);}
.chat-fab.open{background:linear-gradient(135deg,var(--red),#ff6b8a);}
.chat-notif{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--red);font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}

.chat-panel{
  position:fixed;bottom:82px;right:16px;z-index:299;
  width:340px;max-width:calc(100vw - 32px);
  height:480px;max-height:calc(100vh - 120px);
  background:var(--s1);border:1px solid var(--b2);border-radius:16px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
  transition:all .25s;transform-origin:bottom right;
}
.chat-panel.hidden{opacity:0;transform:scale(0.85);pointer-events:none;}
.chat-panel-head{padding:12px 14px;background:var(--s2);border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;}
.chat-panel-head h3{font-family:var(--fh);font-size:13px;color:var(--cy);}
.chat-panel-sub{font-size:10px;color:var(--mu);margin-top:1px;}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.chat-msgs::-webkit-scrollbar{width:3px;}.chat-msgs::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px;}
.cmsg{display:flex;gap:8px;max-width:92%;}
.cmsg.user{align-self:flex-end;flex-direction:row-reverse;}
.cmsg-av{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.cmsg.user .cmsg-av{background:linear-gradient(135deg,var(--cy),var(--gn));color:#060b14;}
.cmsg.ai .cmsg-av{background:var(--s3);border:1px solid var(--b1);}
.cmsg-bub{padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.6;}
.cmsg.user .cmsg-bub{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);border-radius:10px 2px 10px 10px;}
.cmsg.ai .cmsg-bub{background:var(--s2);border:1px solid var(--b1);border-radius:2px 10px 10px 10px;}
.cmsg.ai .cmsg-bub strong{color:var(--gd);}
.cmsg.ai .cmsg-bub code{font-family:var(--fm);font-size:11px;background:var(--s3);padding:1px 4px;border-radius:3px;color:var(--gn);}
.chat-empty{text-align:center;padding:30px 16px;color:var(--mu);}
.chat-empty .cei{font-size:28px;margin-bottom:8px;}
.chat-empty p{font-size:12px;line-height:1.5;}
.chat-chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-top:1px solid var(--b1);}
.cchip{padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid var(--b1);color:var(--mu);background:var(--s2);transition:all .15s;white-space:nowrap;}
.cchip:hover{border-color:var(--cy);color:var(--cy);}
.chat-bar{display:flex;gap:7px;padding:9px 10px;background:var(--s2);border-top:1px solid var(--b1);}
.chat-in{flex:1;background:var(--bg);border:1px solid var(--b1);border-radius:7px;padding:8px 11px;color:var(--tx);font-family:var(--fb);font-size:12px;outline:none;resize:none;min-height:36px;max-height:80px;}
.chat-in:focus{border-color:var(--cy);}
.chat-in::placeholder{color:var(--dm);}
.btn-send{padding:8px 14px;border-radius:7px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cy),var(--gn));color:#060b14;font-family:var(--fh);font-size:12px;font-weight:700;transition:all .2s;white-space:nowrap;}
.btn-send:disabled{opacity:.35;cursor:not-allowed;}

/* ── CURSOR ── */
.cursor{display:inline-block;width:2px;height:12px;background:var(--cy);margin-left:2px;vertical-align:middle;animation:blink .7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease both;}

/* ── KEY CHIP ── */
.key-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:8px;background:rgba(0,255,157,0.07);border:1px solid rgba(0,255,157,0.15);font-size:10px;color:var(--gn);cursor:pointer;transition:all .2s;}
.key-chip:hover{border-color:var(--red);color:var(--red);}

/* responsive */
@media(max-width:600px){
  .content{grid-template-columns:1fr;}
  .card-dolares,.card-recos{grid-column:1;}
  .chat-panel{width:calc(100vw - 24px);right:12px;}
  .topbar{padding:0 10px;gap:8px;}
  .logo-sub{display:none;}
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px;}
</style>
</head>

// ══════════════════════════════════════════════════════════
// MARKDOWN
// ══════════════════════════════════════════════════════════
function md(t) {
  if (!t) return '';
  t = t.replace(/\|(.+)\|[\r\n]+\|[-| :]+\|[\r\n]+((?:\|.+\|[\r\n]*)+)/g, (_,h,r) => {
    const ths = h.split('|').filter(Boolean).map(x=>`<th>${x.trim()}</th>`).join('');
    const trs = r.trim().split('\n').map(row=>{
      const tds = row.split('|').filter(Boolean).map(d=>`<td>${d.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g,'<em>$1</em>');
  t = t.replace(/`(.+?)`/g,'<code>$1</code>');
  t = t.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  t = t.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>[^<]*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  t = t.replace(/\n{2,}/g,'</p><p>');
  return '<p>'+t+'</p>';
}

// ══════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════
async function callAPI(messages, onChunk, sys) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': S.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 3000,
      stream: true,
      system: sys || SYS_ADVISOR,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages,
    }),
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text().catch(()=>'')}`);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf='', full='';
  while(true){
    const {done,value} = await reader.read();
    if(done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      const raw = line.slice(6).trim();
      if(raw==='[DONE]') continue;
      try{
        const ev = JSON.parse(raw);
        if(ev.type==='content_block_delta' && ev.delta?.type==='text_delta'){
          full += ev.delta.text; onChunk(full);
        }
      }catch(_){}
    }
  }
  return full;
}

// ══════════════════════════════════════════════════════════
// LOAD MARKET DATA
// ══════════════════════════════════════════════════════════
async function loadMarket() {
  S.loadingMarket = true;
  renderTicker();
  try {
    const raw = await callAPI([{role:'user',content:MARKET_PROMPT}], ()=>{}, SYS_MARKET);
    const clean = raw.replace(/```json|```/g,'').trim();
    const data = JSON.parse(clean);
    S.dolares = data.dolares || {};
    S.acciones = data.acciones || [];
    S.bonos = data.bonos || [];
    S.tasas = data.tasas || [];
    S.lastUpdate = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    S.loadingMarket = false;
    renderTicker();
    renderDolares();
    renderAcciones();
    renderBonos();
    renderTasas();
    // Now load recommendations with real data
    loadRecos();
  } catch(e) {
    S.loadingMarket = false;
    renderTicker();
    console.error('Market error:', e);
    loadRecos(); // still try recos without structured data
  }
}

// ══════════════════════════════════════════════════════════
// LOAD RECOMMENDATIONS
// ══════════════════════════════════════════════════════════
async function loadRecos() {
  S.recosLoading = true;
  S.recosStreaming = true;
  S.recos = '';
  renderRecos();
  try {
    const marketContext = Object.keys(S.dolares).length > 0
      ? RECOS_PROMPT({dolares:S.dolares, acciones:S.acciones, bonos:S.bonos, tasas:S.tasas})
      : `Sos mi asesor financiero. Hoy es ${new Date().toLocaleDateString('es-AR')}. Buscá datos actualizados del mercado argentino con web search y dame mis mejores recomendaciones concretas de hoy: arbitraje de dólares con cálculo neto, top 3 acciones con ganancia estimada para $1M/$3M/$5M, mejor tasa en pesos hoy, y 2-3 riesgos a monitorear. Formato Markdown con emojis.`;

    await callAPI([{role:'user',content:marketContext}], (chunk)=>{
      S.recos = chunk;
      const el = document.getElementById('reco-content');
      if(el) el.innerHTML = md(chunk)+'<span class="cursor"></span>';
    });
    S.recosStreaming = false;
    S.recosLoading = false;
    const el = document.getElementById('reco-content');
    if(el) el.innerHTML = md(S.recos);
  } catch(e) {
    S.recosLoading = false;
    S.recosStreaming = false;
    S.recos = '❌ Error al cargar recomendaciones. Verificá tu API key.';
    renderRecos();
  }
}

// ══════════════════════════════════════════════════════════
// CHAT
// ══════════════════════════════════════════════════════════
async function sendChat(text) {
  if(!text.trim() || S.chatLoading || !S.apiKey) return;
  S.chatMsgs.push({role:'user',content:text});
  S.chatMsgs.push({role:'ai',content:'',streaming:true});
  S.chatLoading = true;
  renderChatMsgs();

  const ctx = S.recos
    ? `Contexto del análisis de hoy:\n${S.recos.slice(0,2000)}\n\nPregunta: ${text}`
    : text;

  try {
    await callAPI([{role:'user',content:ctx}], (chunk)=>{
      S.chatMsgs[S.chatMsgs.length-1].content = chunk;
      const last = document.querySelector('#chat-msgs .cmsg:last-child .cmsg-bub');
      if(last) last.innerHTML = md(chunk)+'<span class="cursor"></span>';
      const msgs = document.getElementById('chat-msgs');
      if(msgs) msgs.scrollTop = msgs.scrollHeight;
    });
    S.chatMsgs[S.chatMsgs.length-1].streaming = false;
    const last = document.querySelector('#chat-msgs .cmsg:last-child .cmsg-bub');
    if(last) last.innerHTML = md(S.chatMsgs[S.chatMsgs.length-1].content);
  } catch(e) {
    S.chatMsgs[S.chatMsgs.length-1].content = '❌ Error al conectar.';
    S.chatMsgs[S.chatMsgs.length-1].streaming = false;
    renderChatMsgs();
  }
  S.chatLoading = false;
  if(!S.chatOpen) S.chatUnread++;
  renderChatFab();
}

// ══════════════════════════════════════════════════════════
// RENDER HELPERS
// ══════════════════════════════════════════════════════════
function fmt(n) { return n ? '$'+Math.round(n).toLocaleString('es-AR') : '···'; }
function fmtChg(v) {
  if(!v && v!==0) return '';
  const s = v>0?'+':''; const cls = v>0?'up':v<0?'dn':'fl';
  return `<span class="${cls}">${s}${v.toFixed(2)}%</span>`;
}
function recClass(r){
  if(!r) return 'rec-e';
  const u=r.toUpperCase();
  if(u==='COMPRAR') return 'rec-c';
  if(u==='VENDER') return 'rec-v';
  if(u==='MANTENER') return 'rec-m';
  return 'rec-e';
}

function renderTicker() {
  const t = document.getElementById('ticker');
  if(!t) return;
  const d = S.dolares;
  const items = [
    {lbl:'OFICIAL', val:d.oficial?.venta, chg:d.oficial?.var, cls:'cy'},
    {lbl:'BLUE',    val:d.blue?.venta,    chg:d.blue?.var,    cls:'gn'},
    {lbl:'MEP',     val:d.mep?.venta,     chg:d.mep?.var,     cls:'gd'},
    {lbl:'CCL',     val:d.ccl?.venta,     chg:d.ccl?.var,     cls:'or'},
    {lbl:'CRIPTO',  val:d.cripto?.venta,  chg:d.cripto?.var,  cls:'cy'},
  ];
  t.innerHTML = items.map(i=>`
    <div class="tick">
      <span class="tick-lbl">${i.lbl}</span>
      <span class="tick-val ${i.val ? i.cls : 'loading'}">${i.val ? fmt(i.val) : '···'}</span>
      <span class="tick-chg">${i.chg ? fmtChg(i.chg) : ''}</span>
    </div>`).join('');
  const lu = document.getElementById('last-upd');
  if(lu) lu.textContent = S.lastUpdate ? `Act. ${S.lastUpdate}` : '';
  const rb = document.getElementById('btn-refresh-top');
  if(rb) rb.className = 'btn-refresh-top' + (S.loadingMarket ? ' spinning' : '');
}

function renderDolares() {
  const el = document.getElementById('dolares-body');
  if(!el) return;
  const d = S.dolares;
  const items = [
    {k:'oficial', n:'Oficial'},
    {k:'blue', n:'Blue'},
    {k:'mep', n:'MEP/Bolsa'},
    {k:'ccl', n:'CCL'},
    {k:'cripto', n:'Cripto USDT'},
    {k:'tarjeta', n:'Tarjeta'},
  ];
  // Calculate best arbitrage
  const mep = d.mep?.venta || 0;
  const blue = d.blue?.venta || 0;
  const cripto = d.cripto?.venta || 0;
  const bestArb = Math.max(blue - mep, cripto - mep);
  const arbNet = bestArb - (mep * 0.01); // ~1% comisiones

  el.innerHTML = `
    <div class="dolar-grid">
      ${items.map(({k,n})=>{
        const v = d[k]; if(!v) return `<div class="dolar-item"><div class="dolar-name">${n}</div><div class="dolar-buy loading">···</div></div>`;
        return `<div class="dolar-item">
          <div class="dolar-name">${n}</div>
          <div class="dolar-buy">${fmt(v.venta)}</div>
          <div class="dolar-sell">Compra: ${fmt(v.compra)}</div>
          <div class="dolar-chg">${fmtChg(v.var)}</div>
        </div>`;
      }).join('')}
    </div>
    ${arbNet > 5 ? `<div class="arbitraje-tag" style="margin-top:10px;">⚡ Oportunidad de arbitraje: ~${fmt(arbNet)} neto por USD</div>` : ''}
  `;
}

    <div class="accion-item">
      <span class="accion-ticker">${a.ticker}</span>
      <span class="accion-name">${a.nombre}</span>
      <div style="text-align:right">
        <div class="accion-price">${fmt(a.precio)}</div>
        <div class="accion-chg">${fmtChg(a.var)}</div>
      </div>
      <span class="rec-badge ${recClass(a.rec)}" style="margin-left:8px">${a.rec||'—'}</span>
    </div>`).join('');
}

function renderRecos() {
  const el = document.getElementById('reco-content');
  if(!el) return;
  if(S.recosLoading && !S.recos) {
    el.innerHTML = `<div class="reco-loading"><div class="pulse-icon">🤖</div><p>Analizando el mercado y calculando tus mejores movidas de hoy...</p></div>`;
    return;
  }
  el.innerHTML = md(S.recos) + (S.recosStreaming ? '<span class="cursor"></span>' : '');
}

function renderChatMsgs() {
  const el = document.getElementById('chat-msgs');
  if(!el) return;
  if(!S.chatMsgs.length) {
    el.innerHTML = `<div class="chat-empty"><div class="cei">💬</div><p>Preguntame sobre el mercado,<br/>acciones, bonos o dólares</p></div>`;
    return;
  }
  el.innerHTML = S.chatMsgs.map(m=>`
    <div class="cmsg ${m.role}">
      <div class="cmsg-av">${m.role==='user'?'👤':'📈'}</div>
      <div class="cmsg-bub">${m.role==='user' ? m.content : md(m.content)+(m.streaming?'<span class="cursor"></span>':'')}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function renderChatFab() {
  const fab = document.getElementById('chat-fab');
  if(!fab) return;
  fab.className = 'chat-fab' + (S.chatOpen ? ' open' : '');
  fab.innerHTML = S.chatOpen ? '✕' : '💬';
  const notif = document.getElementById('chat-notif');
  if(notif) { notif.style.display = (!S.chatOpen && S.chatUnread) ? 'flex' : 'none'; notif.textContent = S.chatUnread; }
}
