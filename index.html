<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0e17"/>
<title>InversorAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060b14;--s1:#0e1624;--s2:#162030;--s3:#1c2a3e;
  --border:#1f3050;--border2:#2a3f5c;
  --cyan:#00d4ff;--green:#00ff9d;--orange:#ff6b35;--gold:#f5c842;
  --text:#dde6f5;--muted:#5a7296;--dim:#3a5070;
  --danger:#ff3d5a;--ok:#1adb7a;--warn:#ffaa00;
  --font-head:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 100% 60% at 50% -5%,rgba(0,212,255,0.07) 0%,transparent 55%),
  radial-gradient(ellipse 50% 40% at 95% 90%,rgba(0,255,157,0.04) 0%,transparent 50%),
  radial-gradient(ellipse 40% 30% at 5% 70%,rgba(0,100,200,0.04) 0%,transparent 50%);
pointer-events:none;z-index:0;}
 
/* ─── LAYOUT ─── */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}
 
/* ─── HEADER ─── */
.header{
  position:sticky;top:0;z-index:200;
  background:rgba(6,11,20,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 16px;height:58px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.logo-wrap{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.logo-mark{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:0 0 16px rgba(0,212,255,0.3);
}
.logo-text{font-family:var(--font-head);font-weight:800;font-size:17px;
  background:linear-gradient(90deg,var(--cyan),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:9px;color:var(--muted);margin-top:-3px;letter-spacing:.05em;}
 
/* ─── NAV TABS ─── */
.nav{display:flex;gap:2px;}
.nav-btn{
  padding:5px 11px;border-radius:7px;border:1px solid transparent;
  font-family:var(--font-body);font-size:11px;font-weight:500;
  color:var(--muted);background:transparent;cursor:pointer;transition:all .18s;
  white-space:nowrap;
}
.nav-btn:hover{color:var(--text);border-color:var(--border);}
.nav-btn.active{background:var(--s2);color:var(--cyan);border-color:var(--border2);}
 
/* ─── MAIN ─── */
.main{flex:1;max-width:860px;margin:0 auto;width:100%;padding:20px 14px 40px;}
 
/* ─── API KEY BANNER ─── */
.api-banner{
  background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(0,255,157,0.05));
  border:1px solid rgba(0,212,255,0.25);border-radius:12px;
  padding:14px 16px;margin-bottom:18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.api-banner.ok{background:linear-gradient(135deg,rgba(0,255,157,0.07),rgba(0,200,100,0.04));border-color:rgba(0,255,157,0.2);}
.api-icon{font-size:20px;flex-shrink:0;}
.api-info{flex:1;min-width:0;}
.api-info strong{font-family:var(--font-head);font-size:13px;color:var(--text);}
.api-info p{font-size:11px;color:var(--muted);margin-top:1px;}
.api-input-row{display:flex;gap:8px;margin-top:8px;width:100%;}
.api-input{
  flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:8px;
  padding:8px 12px;color:var(--text);font-family:var(--font-mono);font-size:11px;outline:none;
  min-width:0;
}
.api-input:focus{border-color:var(--cyan);}
.api-input::placeholder{color:var(--dim);}
.btn-save-key{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  color:#060b14;font-family:var(--font-head);font-size:12px;font-weight:700;
  white-space:nowrap;transition:all .2s;}
.btn-save-key:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,212,255,.3);}
.key-status{display:flex;align-items:center;gap:6px;font-size:11px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok);}
.dot.warn{background:var(--warn);box-shadow:0 0 6px var(--warn);}
 
/* ─── HERO ─── */
.hero{
  text-align:center;padding:44px 20px 36px;
  border:1px solid var(--border);border-radius:16px;background:var(--s1);
  margin-bottom:20px;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(0,212,255,0.05) 0%,transparent 65%);
  pointer-events:none;}
.hero h1{font-family:var(--font-head);font-size:28px;font-weight:800;line-height:1.15;
  background:linear-gradient(160deg,var(--text) 30%,var(--cyan) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.hero p{color:var(--muted);font-size:13px;margin-bottom:20px;}
.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.badge{padding:3px 11px;border-radius:20px;border:1px solid var(--border2);
  font-size:11px;color:var(--muted);background:var(--s2);}
.badge b{color:var(--text);font-weight:500;}
 
/* ─── BUTTONS ─── */
.btn-main{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 32px;border-radius:12px;border:none;cursor:pointer;
  font-family:var(--font-head);font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  color:#060b14;transition:all .2s;letter-spacing:.01em;
}
.btn-main:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.3);}
.btn-main:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-main.loading{animation:pulse 1.4s infinite;}
.btn-sec{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:8px;
  border:1px solid var(--border2);cursor:pointer;
  font-family:var(--font-head);font-size:12px;font-weight:600;
  background:var(--s2);color:var(--text);transition:all .2s;
}
.btn-sec:hover{border-color:var(--cyan);color:var(--cyan);}
.btn-danger{border-color:rgba(255,61,90,.3);color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);background:rgba(255,61,90,.08);}
 
/* ─── REPORT STREAM ─── */
.report-wrap{background:var(--s1);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.report-topbar{
  padding:13px 18px;border-bottom:1px solid var(--border);background:var(--s2);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.report-topbar h2{font-family:var(--font-head);font-size:14px;font-weight:700;}
.report-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.report-body{padding:18px;font-size:13px;line-height:1.8;}
.report-body h1{font-family:var(--font-head);font-size:19px;color:var(--cyan);margin:20px 0 8px;}
.report-body h2{font-family:var(--font-head);font-size:16px;color:var(--cyan);margin:18px 0 7px;border-bottom:1px solid var(--border);padding-bottom:5px;}
.report-body h3{font-family:var(--font-head);font-size:13px;color:var(--green);margin:14px 0 5px;}
.report-body p{margin-bottom:8px;}
.report-body ul,.report-body ol{padding-left:18px;margin-bottom:10px;}
.report-body li{margin-bottom:3px;}
.report-body strong{color:var(--gold);}
.report-body em{color:var(--muted);}
.report-body code{font-family:var(--font-mono);font-size:11px;background:var(--s3);padding:1px 5px;border-radius:3px;color:var(--green);}
.report-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px;display:block;overflow-x:auto;}
.report-body th{background:var(--s3);color:var(--cyan);padding:7px 10px;text-align:left;font-family:var(--font-head);border:1px solid var(--border);white-space:nowrap;}
.report-body td{padding:7px 10px;border:1px solid var(--border);vertical-align:top;}
.report-body tr:nth-child(even) td{background:rgba(255,255,255,.01);}
.report-body blockquote{border-left:3px solid var(--orange);padding:8px 14px;background:rgba(255,107,53,.05);border-radius:0 7px 7px 0;margin:10px 0;}
 
/* ─── STREAMING CURSOR ─── */
.cursor{display:inline-block;width:2px;height:13px;background:var(--cyan);margin-left:2px;vertical-align:middle;animation:blink .7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
 
/* ─── ALERT CARDS ─── */
.alerts-grid{display:flex;flex-direction:column;gap:10px;}
.alert-card{
  border-radius:12px;padding:14px 16px;border:1px solid;
  display:flex;gap:12px;align-items:flex-start;
}
.alert-card.high{background:rgba(255,61,90,.07);border-color:rgba(255,61,90,.3);}
.alert-card.med{background:rgba(255,170,0,.06);border-color:rgba(255,170,0,.25);}
.alert-card.low{background:rgba(0,255,157,.05);border-color:rgba(0,255,157,.2);}
.alert-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.alert-body strong{font-family:var(--font-head);font-size:13px;color:var(--text);}
.alert-body p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.alert-time{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:4px;}
 
/* ─── CHAT ─── */
.chat-outer{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:400px;}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px;
  background:var(--s1);border:1px solid var(--border);border-radius:12px 12px 0 0;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;gap:10px;max-width:88%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.msg.user .msg-av{background:linear-gradient(135deg,var(--cyan),var(--green));color:#060b14;}
.msg.ai .msg-av{background:var(--s3);border:1px solid var(--border2);}
.msg-bub{padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.65;}
.msg.user .msg-bub{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);border-radius:12px 3px 12px 12px;}
.msg.ai .msg-bub{background:var(--s2);border:1px solid var(--border);border-radius:3px 12px 12px 12px;}
.msg.ai .msg-bub strong{color:var(--gold);}
.msg.ai .msg-bub code{font-family:var(--font-mono);font-size:11px;background:var(--s3);padding:1px 4px;border-radius:3px;color:var(--green);}
.chat-bar{display:flex;gap:8px;padding:10px;background:var(--s2);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;}
.chat-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;resize:none;min-height:40px;max-height:100px;}
.chat-in:focus{border-color:var(--cyan);}
.chat-in::placeholder{color:var(--dim);}
.btn-send{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--green));color:#060b14;font-family:var(--font-head);font-size:13px;font-weight:700;transition:all .2s;white-space:nowrap;}
.btn-send:disabled{opacity:.35;cursor:not-allowed;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{padding:5px 12px;border-radius:18px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--s1);transition:all .18s;}
.chip:hover{border-color:var(--cyan);color:var(--cyan);}
 
/* ─── HISTORY ─── */
.h-list{display:flex;flex-direction:column;gap:10px;}
.h-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.h-head{padding:12px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--s2);}
.h-title{font-family:var(--font-head);font-size:13px;font-weight:600;}
.h-date{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;}
.h-body{max-height:0;overflow:hidden;transition:max-height .35s ease;font-size:12px;line-height:1.75;}
.h-body.open{max-height:4000px;padding:15px;}
.h-body h1,.h-body h2,.h-body h3{font-family:var(--font-head);color:var(--cyan);margin:12px 0 5px;}
.h-body h1{font-size:16px;}.h-body h2{font-size:14px;border-bottom:1px solid var(--border);padding-bottom:3px;}.h-body h3{font-size:12px;color:var(--green);}
.h-body strong{color:var(--gold);}
.h-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px;display:block;overflow-x:auto;}
.h-body th{background:var(--s3);color:var(--cyan);padding:5px 8px;border:1px solid var(--border);white-space:nowrap;}
.h-body td{padding:5px 8px;border:1px solid var(--border);}
.h-body ul{padding-left:14px;}.h-body li{margin-bottom:2px;}
 
/* ─── MISC ─── */
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ei{font-size:38px;margin-bottom:10px;}
.empty p{font-size:13px;line-height:1.6;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;}
.tag-live{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2);}
.tag-ok{background:rgba(0,255,157,.08);color:var(--ok);border:1px solid rgba(0,255,157,.2);}
.ts{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.section-title{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
 
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease both;}
 
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div id="app"></div>
 
<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const S = {
  tab: 'dashboard',
  apiKey: localStorage.getItem('iar_key') || '',
  apiKeyInput: '',
  report: null,
  reportStreaming: false,
  reportLoading: false,
  reportTs: null,
  alerts: JSON.parse(localStorage.getItem('iar_alerts') || '[]'),
  history: JSON.parse(localStorage.getItem('iar_history') || '[]'),
  chatMsgs: [],
  chatInput: '',
  chatLoading: false,
  openHistory: null,
};
 
// ─── SYSTEM PROMPT ────────────────────────────────────────────────────────────
const SYSTEM = `Sos "InversorAR", un analista financiero experto en el mercado argentino.
 
PERFIL DEL USUARIO:
- Inversor moderado con $1M a $10M ARS para invertir
- Busca balance entre rendimiento y preservación de capital
- Horizonte corto-mediano plazo (días a meses)
 
EN CADA ANÁLISIS DIARIO:
1. Buscá cotizaciones ACTUALIZADAS de: dólar oficial, blue, MEP, CCL, cripto (USDT), tarjeta
2. Calculá brechas e identificá oportunidades de arbitraje (neto de comisiones)
3. Analizá 3-5 acciones del Merval con mayor oportunidad
4. Analizá 2-3 CEDEARs (dólar implícito vs CCL)
5. Analizá curva de bonos soberanos (AL30, GD30)
6. Comparar LECAPs/BONCAPs/CER y TNA vs inflación
7. Presentá 3-5 oportunidades concretas con: instrumento, tipo op., entrada, objetivo, horizonte, riesgo, stop loss
8. Listá 2-3 riesgos o factores adversos del día
 
FORMATO: Markdown con emojis. Español argentino. Números específicos con precios reales.`;
 
const ANALYSIS_PROMPT = () => `Generá el análisis completo del mercado argentino para hoy (${new Date().toLocaleDateString('es-AR')}). 
 
Usá este formato en Markdown:
 
# 📊 RESUMEN EJECUTIVO
# 💵 TIPOS DE DÓLAR HOY — cotizaciones + brechas + mejor oportunidad de arbitraje paso a paso
# 📈 ACCIONES DESTACADAS — 3 a 5 acciones con tendencia, soporte/resistencia, recomendación
# 🏦 CEDEARs — 2 a 3 con dólar implícito vs CCL, si están baratos o caros vs Wall Street
# 📋 BONOS SOBERANOS — AL30 y GD30: paridad, TIR, recomendación
# 💰 TASA EN PESOS — mejores LECAPs/BONCAPs/CER hoy con TNA vs inflación proyectada
# 🎯 OPORTUNIDADES CONCRETAS — tabla con instrumento, tipo, entrada, objetivo, horizonte, riesgo, stop loss
# ⚠️ RIESGOS DEL DÍA — 2 a 3 factores adversos a monitorear`;
 
const CHAT_SUGGESTIONS = [
  '¿Conviene comprar dólar MEP hoy?',
  '¿Cuál LECAP rinde más?',
  '¿Están baratos los CEDEARs de MELI?',
  'Analizá el AL30 para mí',
  '¿Hay oportunidad en bancarios?',
  '¿Cómo está la brecha hoy?',
];
 
// ─── MARKDOWN PARSER ──────────────────────────────────────────────────────────
function md(text) {
  if (!text) return '';
  // Tables
  text = text.replace(/\|(.+)\|[\r\n]+\|[-| :]+\|[\r\n]+((?:\|.+\|[\r\n]*)+)/g, (_, hdr, rows) => {
    const ths = hdr.split('|').filter(Boolean).map(h => `<th>${h.trim()}</th>`).join('');
    const trs = rows.trim().split('\n').map(r => {
      const tds = r.split('|').filter(Boolean).map(d => `<td>${d.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/`(.+?)`/g, '<code>$1</code>');
  text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  text = text.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>[^<]*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  text = text.replace(/\n{2,}/g, '</p><p>');
  return '<p>' + text + '</p>';
}
 
// ─── API CALL WITH STREAMING ──────────────────────────────────────────────────
async function streamClaude(messages, onChunk, systemOverride) {
  const key = S.apiKey;
  if (!key) throw new Error('NO_KEY');
 
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      stream: true,
      system: systemOverride || SYSTEM,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages,
    }),
  });
 
  if (!res.ok) {
    const err = await res.text().catch(() => '');
    throw new Error(`API ${res.status}: ${err}`);
  }
 
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
 
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const raw = line.slice(6).trim();
      if (raw === '[DONE]') continue;
      try {
        const ev = JSON.parse(raw);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          full += ev.delta.text;
          onChunk(full);
        }
      } catch (_) {}
    }
  }
  return full;
}
 
// ─── EXTRACT ALERTS FROM REPORT ───────────────────────────────────────────────
function extractAlerts(reportText) {
  const alerts = [];
  const now = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  const date = new Date().toLocaleDateString('es-AR');
 
  // Find RIESGOS section
  const riskMatch = reportText.match(/⚠️[^\n]*RIESGOS[^\n]*([\s\S]*?)(?=\n#|$)/i);
  if (riskMatch) {
    const lines = riskMatch[1].split('\n').filter(l => l.trim().match(/^[-*•]|^\d+\./));
    lines.slice(0, 3).forEach(l => {
      const clean = l.replace(/^[-*•\d.]\s*/, '').replace(/\*\*/g, '').trim();
      if (clean.length > 10) alerts.push({ type: 'high', icon: '⚠️', text: clean, time: `${date} ${now}` });
    });
  }
 
  // Find OPORTUNIDADES section
  const oppMatch = reportText.match(/🎯[^\n]*OPORTUNIDADES[^\n]*([\s\S]*?)(?=\n#|$)/i);
  if (oppMatch) {
    const rows = oppMatch[1].match(/\|[^|]+\|[^|]+\|[^|]+\|/g);
    if (rows) rows.slice(1, 3).forEach(r => {
      const cells = r.split('|').filter(Boolean).map(c => c.trim());
      if (cells.length >= 2 && !cells[0].match(/^[-:]+$/)) {
        alerts.push({ type: 'low', icon: '🎯', text: `Oportunidad: ${cells[0]} — ${cells[1] || ''}`, time: `${date} ${now}` });
      }
    });
  }
 
  return alerts;
}
 
// ─── RENDER ───────────────────────────────────────────────────────────────────
function nowStr() {
  return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}
function todayStr() {
  return new Date().toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
 
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    <main class="main">
      ${renderApiKeyBanner()}
      ${S.tab === 'dashboard' ? renderDashboard() : ''}
      ${S.tab === 'alertas'   ? renderAlertas()   : ''}
      ${S.tab === 'chat'      ? renderChat()       : ''}
      ${S.tab === 'historial' ? renderHistorial()  : ''}
    </main>
  `;
  bindEvents();
  if (S.tab === 'chat') scrollChatToBottom();
}
 
function renderHeader() {
  const tabs = [['dashboard','🏠'],['alertas','🔔'],['chat','💬'],['historial','🗂️']];
  return `
    <header class="header">
      <div class="logo-wrap">
        <div class="logo-mark">📈</div>
        <div>
          <div class="logo-text">InversorAR</div>
          <div class="logo-sub">Mercado argentino · IA</div>
        </div>
      </div>
      <nav class="nav">
        ${tabs.map(([id, icon]) => `
          <button class="nav-btn ${S.tab === id ? 'active' : ''}" data-tab="${id}">${icon} ${id.charAt(0).toUpperCase() + id.slice(1)}</button>
        `).join('')}
      </nav>
    </header>`;
}
 
function renderApiKeyBanner() {
  if (S.apiKey) return `
    <div class="api-banner ok fade-in" style="margin-bottom:14px;">
      <div class="api-icon">🔑</div>
      <div class="api-info">
        <strong>API Key configurada</strong>
        <p>${S.apiKey.slice(0,14)}••••••••••••</p>
      </div>
      <div class="row" style="gap:6px;">
        <span class="tag tag-ok">● Activa</span>
        <button class="btn-sec btn-danger" id="btn-clear-key" style="padding:5px 10px;font-size:11px;">Cambiar</button>
      </div>
    </div>`;
 
  return `
    <div class="api-banner fade-in" style="margin-bottom:14px;">
      <div class="api-icon">🔑</div>
      <div class="api-info">
        <strong>Configurá tu API Key de Anthropic</strong>
        <p>Necesaria para generar análisis. Conseguila en console.anthropic.com</p>
        <div class="api-input-row">
          <input class="api-input" id="api-key-input" type="password" placeholder="sk-ant-api03-..." value="${S.apiKeyInput}"/>
          <button class="btn-save-key" id="btn-save-key">Guardar</button>
        </div>
      </div>
    </div>`;
}
 
function renderDashboard() {
  if (S.reportLoading && !S.report) return `
    <div class="report-wrap fade-in">
      <div class="report-topbar"><h2>📊 Analizando el mercado...</h2><span class="report-meta">Buscando datos en tiempo real</span></div>
      <div class="report-body" style="padding:30px;text-align:center;color:var(--muted);">
        <div style="font-size:32px;margin-bottom:12px;animation:pulse 1.2s infinite;">📡</div>
        <p style="font-family:var(--font-head);font-size:14px;color:var(--text);margin-bottom:6px;">Consultando fuentes en tiempo real</p>
        <p style="font-size:12px;">Cotizaciones · Merval · Bonos · CEDEARs · Tasas</p>
      </div>
    </div>`;
 
  if (S.report) return `
    <div>
      <div class="row" style="margin-bottom:14px;">
        <span class="tag tag-live">● EN VIVO</span>
        ${S.reportTs ? `<span class="ts">Actualizado ${S.reportTs}</span>` : ''}
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn-sec" id="btn-refresh" ${S.reportLoading ? 'disabled' : ''}>🔄 Actualizar</button>
          <button class="btn-sec" id="btn-clear-report" style="font-size:11px;padding:6px 10px;">✕</button>
        </div>
      </div>
      <div class="report-wrap fade-in">
        <div class="report-topbar">
          <h2>📊 Análisis del mercado</h2>
          <span class="report-meta">${todayStr()}</span>
        </div>
        <div class="report-body" id="report-content">${md(S.report)}${S.reportStreaming ? '<span class="cursor"></span>' : ''}</div>
      </div>
    </div>`;
 
  return `
    <div>
      <div class="hero">
        <h1>Mercado Argentino<br/>al día</h1>
        <p>Análisis con IA en tiempo real · Acciones · Bonos · Dólares · CEDEARs</p>
        <div class="badges">
          <div class="badge">⚖️ Perfil <b>Moderado</b></div>
          <div class="badge">💰 Capital <b>$1M–$10M ARS</b></div>
          <div class="badge">🗓️ <b>${new Date().toLocaleDateString('es-AR')}</b></div>
        </div>
        <button class="btn-main ${!S.apiKey ? '' : ''}" id="btn-analyze" ${!S.apiKey ? 'disabled title="Configurá tu API key primero"' : ''}>
          🔍 Analizar mercado hoy
        </button>
        ${!S.apiKey ? '<p style="margin-top:10px;font-size:11px;color:var(--muted);">⬆️ Configurá tu API key arriba para comenzar</p>' : ''}
      </div>
      ${S.history.length > 0 ? `
        <div style="margin-top:4px;">
          <div class="section-title">Último análisis guardado</div>
          <div class="h-card fade-in" style="cursor:pointer;" id="btn-load-last">
            <div class="h-head">
              <div>
                <div class="h-title">📊 ${S.history[0].date}</div>
                <div class="h-date">${S.history[0].time} · Tocá para ver</div>
              </div>
              <span style="color:var(--muted);font-size:13px;">▶</span>
            </div>
          </div>
        </div>` : ''}
    </div>`;
}
 
function renderAlertas() {
  const all = S.alerts;
  return `
    <div>
      <div class="row" style="margin-bottom:16px;">
        <div class="section-title" style="margin-bottom:0;">🔔 Alertas y avisos</div>
        ${all.length ? `<button class="btn-sec btn-danger" id="btn-clear-alerts" style="margin-left:auto;font-size:11px;padding:5px 10px;">Limpiar todo</button>` : ''}
      </div>
      ${all.length === 0 ? `
        <div class="empty fade-in">
          <div class="ei">🔔</div>
          <p>No hay alertas todavía.<br/>Generá un análisis desde el Dashboard<br/>para recibir avisos automáticos.</p>
        </div>` : `
        <div class="alerts-grid fade-in">
          ${all.map((a, i) => `
            <div class="alert-card ${a.type}">
              <div class="alert-icon">${a.icon}</div>
              <div class="alert-body" style="flex:1;">
                <strong>${a.text.length > 80 ? a.text.slice(0,80)+'…' : a.text}</strong>
                <div class="alert-time">${a.time}</div>
              </div>
              <button class="btn-sec" data-del-alert="${i}" style="padding:4px 8px;font-size:11px;flex-shrink:0;">✕</button>
            </div>`).join('')}
        </div>`}
    </div>`;
}
 
function renderChat() {
  const hasContext = !!S.report;
  return `
    <div>
      ${hasContext ? `<div class="row" style="margin-bottom:12px;"><span class="tag tag-ok">● Con contexto del análisis de hoy</span></div>` : `<div class="row" style="margin-bottom:12px;"><span class="tag" style="background:rgba(90,114,150,.1);color:var(--muted);border:1px solid var(--border);">Sin análisis cargado — podés igualmente preguntar</span></div>`}
      ${S.chatMsgs.length === 0 ? `<div class="chips">${CHAT_SUGGESTIONS.map(s => `<button class="chip" data-chip="${encodeURIComponent(s)}">${s}</button>`).join('')}</div>` : ''}
      <div class="chat-outer">
        <div class="chat-msgs" id="chat-msgs">
          ${S.chatMsgs.length === 0 ? `<div class="empty" style="padding:30px 20px;"><div class="ei">💬</div><p>Preguntá sobre el mercado,<br/>acciones, bonos, dólares o CEDEARs</p></div>` : ''}
          ${S.chatMsgs.map(m => `
            <div class="msg ${m.role}">
              <div class="msg-av">${m.role === 'user' ? '👤' : '📈'}</div>
              <div class="msg-bub">${m.role === 'user' ? m.content : md(m.content) + (m.streaming ? '<span class="cursor"></span>' : '')}</div>
            </div>`).join('')}
        </div>
        <div class="chat-bar">
          <textarea class="chat-in" id="chat-input" placeholder="Preguntá sobre el mercado..." rows="1">${S.chatInput}</textarea>
          <button class="btn-send" id="btn-send-chat" ${S.chatLoading || !S.apiKey ? 'disabled' : ''}>
            ${S.chatLoading ? '···' : 'Enviar'}
          </button>
        </div>
      </div>
    </div>`;
}
 
function renderHistorial() {
  const items = S.history;
  return `
    <div>
      <div class="row" style="margin-bottom:16px;">
        <div class="section-title" style="margin-bottom:0;">🗂️ Historial de análisis</div>
        ${items.length ? `<button class="btn-sec btn-danger" id="btn-clear-history" style="margin-left:auto;font-size:11px;padding:5px 10px;">Limpiar</button>` : ''}
      </div>
      ${items.length === 0 ? `
        <div class="empty fade-in">
          <div class="ei">🗂️</div>
          <p>Todavía no hay análisis guardados.<br/>Generá el primero desde el Dashboard.</p>
        </div>` : `
        <div class="h-list fade-in">
          ${items.map((item, i) => `
            <div class="h-card">
              <div class="h-head" data-toggle="${i}">
                <div>
                  <div class="h-title">📊 ${item.date}</div>
                  <div class="h-date">${item.time} · ${(item.content.length/1000).toFixed(1)}k caracteres</div>
                </div>
                <span style="color:var(--muted);font-size:13px;">${S.openHistory === i ? '▲' : '▼'}</span>
              </div>
              <div class="h-body ${S.openHistory === i ? 'open' : ''}">${S.openHistory === i ? md(item.content) : ''}</div>
            </div>`).join('')}
        </div>`}
    </div>`;
}
 
// ─── BIND EVENTS ─────────────────────────────────────────────────────────────
function bindEvents() {
  // Tab navigation
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { S.tab = btn.dataset.tab; render(); });
  });
 
  // API Key
  const keyInput = document.getElementById('api-key-input');
  if (keyInput) {
    keyInput.addEventListener('input', e => { S.apiKeyInput = e.target.value; });
    keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });
  }
  document.getElementById('btn-save-key')?.addEventListener('click', saveKey);
  document.getElementById('btn-clear-key')?.addEventListener('click', () => {
    S.apiKey = ''; S.apiKeyInput = '';
    localStorage.removeItem('iar_key');
    render();
  });
 
  // Dashboard
  document.getElementById('btn-analyze')?.addEventListener('click', generateReport);
  document.getElementById('btn-refresh')?.addEventListener('click', generateReport);
  document.getElementById('btn-clear-report')?.addEventListener('click', () => { S.report = null; render(); });
  document.getElementById('btn-load-last')?.addEventListener('click', () => {
    S.report = S.history[0].content;
    S.reportTs = S.history[0].time;
    render();
  });
 
  // Alertas
  document.getElementById('btn-clear-alerts')?.addEventListener('click', () => {
    S.alerts = []; localStorage.setItem('iar_alerts', '[]'); render();
  });
  document.querySelectorAll('[data-del-alert]').forEach(btn => {
    btn.addEventListener('click', () => {
      S.alerts.splice(parseInt(btn.dataset.delAlert), 1);
      localStorage.setItem('iar_alerts', JSON.stringify(S.alerts));
      render();
    });
  });
 
  // Chat
  const chatIn = document.getElementById('chat-input');
  if (chatIn) {
    chatIn.addEventListener('input', e => { S.chatInput = e.target.value; });
    chatIn.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
  }
  document.getElementById('btn-send-chat')?.addEventListener('click', sendChat);
  document.querySelectorAll('[data-chip]').forEach(btn => {
    btn.addEventListener('click', () => {
      S.chatInput = decodeURIComponent(btn.dataset.chip);
      sendChat();
    });
  });
 
  // History toggle
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.toggle);
      S.openHistory = S.openHistory === i ? null : i;
      render();
    });
  });
  document.getElementById('btn-clear-history')?.addEventListener('click', () => {
    if (confirm('¿Limpiar todo el historial?')) {
      S.history = []; localStorage.setItem('iar_history', '[]'); render();
    }
  });
}
 
function saveKey() {
  const val = (document.getElementById('api-key-input')?.value || S.apiKeyInput).trim();
  if (!val.startsWith('sk-')) {
    alert('La API key debe empezar con "sk-ant-..."');
    return;
  }
  S.apiKey = val;
  localStorage.setItem('iar_key', val);
  render();
}
 
// ─── GENERATE REPORT ─────────────────────────────────────────────────────────
async function generateReport() {
  S.reportLoading = true;
  S.reportStreaming = true;
  S.report = '';
  render();
 
  try {
    const full = await streamClaude(
      [{ role: 'user', content: ANALYSIS_PROMPT() }],
      (chunk) => {
        S.report = chunk;
        const el = document.getElementById('report-content');
        if (el) el.innerHTML = md(chunk) + '<span class="cursor"></span>';
      }
    );
 
    S.report = full;
    S.reportTs = nowStr();
    S.reportStreaming = false;
    S.reportLoading = false;
 
    // Save to history
    const entry = { date: new Date().toLocaleDateString('es-AR'), time: nowStr(), content: full };
    S.history = [entry, ...S.history].slice(0, 30);
    localStorage.setItem('iar_history', JSON.stringify(S.history));
 
    // Extract and save alerts
    const newAlerts = extractAlerts(full);
    if (newAlerts.length) {
      S.alerts = [...newAlerts, ...S.alerts].slice(0, 50);
      localStorage.setItem('iar_alerts', JSON.stringify(S.alerts));
    }
 
    render();
  } catch (e) {
    S.reportLoading = false;
    S.reportStreaming = false;
    S.report = null;
    render();
    const msg = e.message.includes('NO_KEY') ? 'Configurá tu API key primero.' : `Error: ${e.message}`;
    alert('⚠️ ' + msg);
  }
}
 
// ─── CHAT ─────────────────────────────────────────────────────────────────────
async function sendChat() {
  const text = (document.getElementById('chat-input')?.value || S.chatInput).trim();
  if (!text || S.chatLoading || !S.apiKey) return;
 
  S.chatInput = '';
  S.chatMsgs.push({ role: 'user', content: text });
  S.chatMsgs.push({ role: 'ai', content: '', streaming: true });
  S.chatLoading = true;
  render();
 
  const context = S.report
    ? `Contexto — análisis del día:\n\n${S.report.slice(0, 3000)}\n\n---\n\nPregunta: ${text}`
    : text;
 
  try {
    await streamClaude(
      [{ role: 'user', content: context }],
      (chunk) => {
        S.chatMsgs[S.chatMsgs.length - 1].content = chunk;
        const msgs = document.getElementById('chat-msgs');
        const lastMsg = msgs?.lastElementChild;
        if (lastMsg) {
          const bub = lastMsg.querySelector('.msg-bub');
          if (bub) bub.innerHTML = md(chunk) + '<span class="cursor"></span>';
        }
        scrollChatToBottom();
      }
    );
    S.chatMsgs[S.chatMsgs.length - 1].streaming = false;
  } catch (e) {
    S.chatMsgs[S.chatMsgs.length - 1].content = '❌ Error al conectar con la API.';
    S.chatMsgs[S.chatMsgs.length - 1].streaming = false;
  }
 
  S.chatLoading = false;
  render();
}
 
function scrollChatToBottom() {
  const el = document.getElementById('chat-msgs');
  if (el) el.scrollTop = el.scrollHeight;
}
 
// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
